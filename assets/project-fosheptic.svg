<svg xmlns="http://www.w3.org/2000/svg" width="860" height="148" viewBox="0 0 860 148" role="img" aria-label="Fosheptic AC Flagship System">
  <defs>
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171c26"/>
      <stop offset="45%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>
    <linearGradient id="cardChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#272c36"/>
      <stop offset="78%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="titleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="diagSheen" x1="0%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <polygon points="10,1 850,1 859,10 859,138 850,147 10,147 1,138 1,10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="860" height="148" fill="url(#cardPlate)"/>
    <polygon points="0,0 860,0 460,148 0,148" fill="url(#diagSheen)"/>
    <!-- Crimson Left Accent Edge -->
    <rect x="0" y="0" width="5" height="148" fill="#dc2626"/>
    <rect x="5" y="0" width="1.5" height="148" fill="#450a0a"/>
  </g>

  <!-- Outer Chiseled Chrome Border -->
  <polygon points="10,1.2 850,1.2 858.8,10 858.8,138 850,146.8 10,146.8 1.2,138 1.2,10"
           fill="none" stroke="url(#cardChrome)" stroke-width="1.5"/>

  <!-- Gothic Shield Emblem -->
  <g transform="translate(26, 22)">
    <polygon points="15,0 29,6 26.5,21 15,31 3.5,21 1,6" fill="#0d1117" stroke="url(#titleMetal)" stroke-width="1.5"/>
    <polygon points="15,4.5 24,8.5 22.2,18.5 15,25.5 7.8,18.5 6,8.5" fill="#991b1b" stroke="#ef4444" stroke-width="0.8"/>
    <polygon points="15,4.5 24,8.5 15,15" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- Title + Flagship Pill -->
  <text x="68" y="42" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="2.2" fill="url(#titleMetal)">FOSHEPTIC AC</text>
  <rect x="252" y="23" width="214" height="22" rx="3" fill="#2b0b10" stroke="#dc2626" stroke-width="1"/>
  <text x="359" y="38" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.8" font-weight="700" letter-spacing="1.2" fill="#fca5a5">PROJECT LEADER · FLAGSHIP</text>

  <!-- Right-side Active Status -->
  <rect x="752" y="22" width="84" height="22" rx="4" fill="#12161f" stroke="#4b5563" stroke-width="1"/>
  <circle cx="767" cy="33" r="3.5" fill="#ef4444"/>
  <text x="777" y="37" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#f3f4f6">ACTIVE</text>

  <!-- Technical Description -->
  <text x="28" y="72" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.2" fill="#d1d5db">Next-generation anti-cheat &amp; security enforcement architecture built for deterministic detection,</text>
  <text x="28" y="92" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.2" fill="#9ca3af">low-overhead runtime telemetry, and resilient server-side validation.</text>

  <!-- Bottom Micro-Tags -->
  <rect x="28" y="110" width="41" height="22" rx="3" fill="#141821" stroke="#3f4654" stroke-width="1"/>
  <text x="48.6" y="124.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#d1d5db">C++</text>
  <rect x="77" y="110" width="169" height="22" rx="3" fill="#141821" stroke="#3f4654" stroke-width="1"/>
  <text x="161.6" y="124.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#d1d5db">Security Architecture</text>
  <rect x="254" y="110" width="98" height="22" rx="3" fill="#141821" stroke="#3f4654" stroke-width="1"/>
  <text x="303.1" y="124.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#d1d5db">Anti-Tamper</text>
  <rect x="360" y="110" width="84" height="22" rx="3" fill="#141821" stroke="#3f4654" stroke-width="1"/>
  <text x="401.9" y="124.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#d1d5db">Telemetry</text>
  <rect x="451" y="110" width="155" height="22" rx="3" fill="#141821" stroke="#3f4654" stroke-width="1"/>
  <text x="528.5" y="124.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#d1d5db">Systems Engineering</text>
</svg>
