<svg xmlns="http://www.w3.org/2000/svg" width="880" height="34" viewBox="0 0 880 34" role="img" aria-label="02 // LIVE.PRESENCE">
  <defs>
    <linearGradient id="chromeBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="chromeTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e7eb" stop-opacity="0.85"/>
      <stop offset="18%" stop-color="#6b7280" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Left Metallic Chrome Indicator Bar -->
  <rect x="14" y="7" width="3.5" height="20" rx="1" fill="url(#chromeBar)"/>
  <rect x="20" y="10" width="1.5" height="14" fill="#6b7280" fill-opacity="0.7"/>
  <!-- Index + Title -->
  <text x="30" y="22.5" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="1.4">
    <tspan fill="#8b949e">[</tspan><tspan fill="#ffffff">02</tspan><tspan fill="#8b949e">]</tspan><tspan fill="#6b7280"> // </tspan><tspan fill="url(#chromeTitle)">LIVE.PRESENCE</tspan>
  </text>
  <!-- Trailing Chrome Hairline Rule -->
  <rect x="239" y="17" width="627" height="1.2" fill="url(#ruleGrad)"/>
</svg>
