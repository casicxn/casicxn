<svg xmlns="http://www.w3.org/2000/svg" width="340" height="38" viewBox="0 0 340 38" role="img" aria-label="Fosheptic | Project Leader">
  <defs>
    <linearGradient id="chromeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#1f242d"/>
      <stop offset="72%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="obsidianPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c212b"/>
      <stop offset="45%" stop-color="#0b0e13"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="crimsonBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="sheenOverlay" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="outerClip">
      <polygon points="7,1 333,1 339,7 339,31 333,37 7,37 1,31 1,7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <!-- Left Obsidian Chrome Segment -->
    <rect x="0" y="0" width="152" height="38" fill="url(#obsidianPlate)"/>
    <!-- Right Crimson Metallic Segment -->
    <polygon points="146,0 340,0 340,38 156,38" fill="url(#crimsonBevel)"/>
    <!-- Top Specular Sheen -->
    <polygon points="0,0 340,0 340,18 0,24" fill="url(#sheenOverlay)"/>
    <!-- Diagonal Seam Highlight -->
    <line x1="146" y1="0" x2="156" y2="38" stroke="#fca5a5" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="145" y1="0" x2="155" y2="38" stroke="#050608" stroke-opacity="0.85" stroke-width="1.2"/>
  </g>

  <!-- Outer Chiseled Chrome Border -->
  <polygon points="7,1.2 333,1.2 338.8,7 338.8,31 333,36.8 7,36.8 1.2,31 1.2,7"
           fill="none" stroke="url(#chromeBorder)" stroke-width="1.4"/>
  <!-- Inner Subtle Bevel -->
  <polygon points="8,2.6 332,2.6 337.4,8 337.4,30 332,35.4 8,35.4 2.6,30 2.6,8"
           fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.7"/>

  <!-- Sharp Gothic Shield Mark -->
  <g transform="translate(15, 9)">
    <polygon points="9,0 17,3.5 15.5,12.5 9,19 2.5,12.5 1,3.5" fill="url(#obsidianPlate)" stroke="url(#silverText)" stroke-width="1.2"/>
    <polygon points="9,3 13.5,5.2 12.6,11.2 9,15.2 5.4,11.2 4.5,5.2" fill="#dc2626"/>
    <polygon points="9,3 13.5,5.2 9,9.2" fill="#fca5a5" fill-opacity="0.45"/>
  </g>

  <!-- Labels -->
  <text x="41" y="23.5" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.8" fill="url(#silverText)">FOSHEPTIC</text>
  <text x="169" y="23.5" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.2" font-weight="800" letter-spacing="1.7" fill="#ffffff">PROJECT LEADER</text>
</svg>
