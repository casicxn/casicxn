<svg xmlns="http://www.w3.org/2000/svg" width="108" height="34" viewBox="0 0 108 34" role="img" aria-label="FastAPI">
  <defs>
    <linearGradient id="bdr_fastapi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="rim_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="icon_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_fastapi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_fastapi">
      <polygon points="6,1 102,1 107,6 107,28 102,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_fastapi)">
    <rect x="0" y="0" width="108" height="34" fill="url(#bg_fastapi)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 56,0 36,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Monochrome chrome-white bevel notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="url(#rim_fastapi)"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 102,1.2 106.8,6 106.8,28 102,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_fastapi)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 101,2.6 105.4,7 105.4,27 101,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- 16x16 Monochrome Metallic Logo -->
  <g transform="translate(13, 9) scale(0.6667)" fill="url(#icon_fastapi)">
      <path d="M12 .0387C5.3729.0384.0003 5.3931 0 11.9988c-.001 6.6066 5.372 11.9628 12 11.9625 6.628.0003 12.001-5.3559 12-11.9625-.0003-6.6057-5.3729-11.9604-12-11.96m-.829 5.4153h7.55l-7.5805 5.3284h5.1828L5.279 18.5436q2.9466-6.5444 5.892-13.0896"/>
  </g>

  <!-- Tracked Uppercase Chrome Label -->
  <text x="38" y="21" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="url(#txt_fastapi)">FASTAPI</text>
</svg>
