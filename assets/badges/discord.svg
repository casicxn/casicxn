<svg xmlns="http://www.w3.org/2000/svg" width="133" height="34" viewBox="0 0 133 34" role="img" aria-label="Discord.js">
  <defs>
    <linearGradient id="bdr_discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_discord" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="rim_discord" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="icon_discord" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_discord" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_discord">
      <polygon points="6,1 127,1 132,6 132,28 127,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_discord)">
    <rect x="0" y="0" width="133" height="34" fill="url(#bg_discord)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 69,0 45,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Monochrome chrome-white bevel notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="url(#rim_discord)"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 127,1.2 131.8,6 131.8,28 127,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_discord)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 126,2.6 130.4,7 130.4,27 126,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

