  <!-- Tracked Uppercase Chrome Label -->
  <text x="38" y="21" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="url(#txt_githubactions)">GITHUB ACTIONS</text>
</svg>
