<svg xmlns="http://www.w3.org/2000/svg" width="164" height="34" viewBox="0 0 164 34" role="img" aria-label="GitHub Actions">
  <defs>
    <linearGradient id="bdr_githubactions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_githubactions" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="icon_githubactions" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_githubactions" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_githubactions">
      <polygon points="6,1 158,1 163,6 163,28 158,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_githubactions)">
    <rect x="0" y="0" width="164" height="34" fill="url(#bg_githubactions)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 85,0 55,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Subtle 2px crimson accent notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="#dc2626"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 158,1.2 162.8,6 162.8,28 158,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_githubactions)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 157,2.6 161.4,7 161.4,27 157,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

