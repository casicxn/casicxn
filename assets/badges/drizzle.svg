<svg xmlns="http://www.w3.org/2000/svg" width="144" height="34" viewBox="0 0 144 34" role="img" aria-label="Drizzle ORM">
  <defs>
    <linearGradient id="bdr_drizzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_drizzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="icon_drizzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_drizzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_drizzle">
      <polygon points="6,1 138,1 143,6 143,28 138,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_drizzle)">
    <rect x="0" y="0" width="144" height="34" fill="url(#bg_drizzle)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 74,0 48,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Subtle 2px crimson accent notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="#dc2626"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 138,1.2 142.8,6 142.8,28 138,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_drizzle)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 137,2.6 141.4,7 141.4,27 137,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- 16x16 Monochrome Metallic Logo -->
  <g transform="translate(13, 9) scale(0.6667)" fill="url(#icon_drizzle)">
      <path d="M5.353 11.823a1.036 1.036 0 0 0-.395-1.422 1.063 1.063 0 0 0-1.437.399L.138 16.702a1.035 1.035 0 0 0 .395 1.422 1.063 1.063 0 0 0 1.437-.398l3.383-5.903Zm11.216 0a1.036 1.036 0 0 0-.394-1.422 1.064 1.064 0 0 0-1.438.399l-3.382 5.902a1.036 1.036 0 0 0 .394 1.422c.506.283 1.15.104 1.438-.398l3.382-5.903Zm7.293-4.525a1.036 1.036 0 0 0-.395-1.422 1.062 1.062 0 0 0-1.437.399l-3.383 5.902a1.036 1.036 0 0 0 .395 1.422 1.063 1.063 0 0 0 1.437-.399l3.383-5.902Zm-11.219 0a1.035 1.035 0 0 0-.394-1.422 1.064 1.064 0 0 0-1.438.398l-3.382 5.903a1.036 1.036 0 0 0 .394 1.422c.506.282 1.15.104 1.438-.399l3.382-5.902Z"/>
  </g>

  <!-- Tracked Uppercase Chrome Label -->
  <text x="38" y="21" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="url(#txt_drizzle)">DRIZZLE ORM</text>
</svg>
