<svg xmlns="http://www.w3.org/2000/svg" width="100" height="34" viewBox="0 0 100 34" role="img" aria-label="Vitest">
  <defs>
    <linearGradient id="bdr_vitest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_vitest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="rim_vitest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="icon_vitest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_vitest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_vitest">
      <polygon points="6,1 94,1 99,6 99,28 94,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_vitest)">
    <rect x="0" y="0" width="100" height="34" fill="url(#bg_vitest)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 52,0 34,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Monochrome chrome-white bevel notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="url(#rim_vitest)"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 94,1.2 98.8,6 98.8,28 94,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_vitest)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 93,2.6 97.4,7 97.4,27 93,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- 16x16 Monochrome Metallic Logo -->
  <g transform="translate(13, 9) scale(0.6667)" fill="url(#icon_vitest)">
      <path d="M11.545 23.3a.613.613 0 0 1-.895.197L.252 15.936A.61.61 0 0 1 0 15.439V6.325c0-.502.569-.792.975-.497l6.358 4.624c.594.433 1.432.25 1.793-.39L14.393.7a.62.62 0 0 1 .535-.314h8.455a.613.613 0 0 1 .537.916z"/>
  </g>

  <!-- Tracked Uppercase Chrome Label -->
  <text x="38" y="21" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="url(#txt_vitest)">VITEST</text>
</svg>
