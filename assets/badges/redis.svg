<svg xmlns="http://www.w3.org/2000/svg" width="93" height="34" viewBox="0 0 93 34" role="img" aria-label="Redis">
  <defs>
    <linearGradient id="bdr_redis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_redis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="icon_redis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_redis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_redis">
      <polygon points="6,1 87,1 92,6 92,28 87,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_redis)">
    <rect x="0" y="0" width="93" height="34" fill="url(#bg_redis)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 48,0 31,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Subtle 2px crimson accent notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="#dc2626"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
