    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 70,0 45,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Subtle 2px crimson accent notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="#dc2626"/>
