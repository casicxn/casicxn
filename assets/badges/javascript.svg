    </linearGradient>
    <clipPath id="clip_javascript">
      <polygon points="6,1 129,1 134,6 134,28 129,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_javascript)">
