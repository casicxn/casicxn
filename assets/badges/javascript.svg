      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_javascript" x1="0%" y1="0%" x2="0%" y2="100%">
