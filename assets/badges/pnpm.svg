<svg xmlns="http://www.w3.org/2000/svg" width="89" height="34" viewBox="0 0 89 34" role="img" aria-label="pnpm">
  <defs>
    <linearGradient id="bdr_pnpm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#9ca3af"/>
      <stop offset="48%" stop-color="#181c24"/>
      <stop offset="76%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bg_pnpm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="rim_pnpm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="icon_pnpm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="txt_pnpm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="clip_pnpm">
      <polygon points="6,1 83,1 88,6 88,28 83,33 6,33 1,28 1,6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip_pnpm)">
    <rect x="0" y="0" width="89" height="34" fill="url(#bg_pnpm)"/>
    <!-- Subtle upper-left specular reflection facet -->
    <polygon points="0,0 46,0 30,34 0,34" fill="#ffffff" fill-opacity="0.06"/>
    <!-- Monochrome chrome-white bevel notch on left rim -->
    <rect x="1" y="8" width="2.4" height="18" fill="url(#rim_pnpm)"/>
  </g>

  <!-- 3D Chrome Bevel Outer Stroke -->
  <polygon points="6,1.2 83,1.2 87.8,6 87.8,28 83,32.8 6,32.8 1.2,28 1.2,6"
           fill="none" stroke="url(#bdr_pnpm)" stroke-width="1.35"/>
  <!-- Inner Crisp Specular Edge -->
  <polygon points="7,2.6 82,2.6 86.4,7 86.4,27 82,31.4 7,31.4 2.6,27 2.6,7"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- 16x16 Monochrome Metallic Logo -->
  <g transform="translate(13, 9) scale(0.6667)" fill="url(#icon_pnpm)">
      <path d="M0 0v7.5h7.5V0zm8.25 0v7.5h7.498V0zm8.25 0v7.5H24V0zM2 2h3.5v3.5H2zm8.25 0h3.498v3.5H10.25zm8.25 0H22v3.5h-3.5zM8.25 8.25v7.5h7.498v-7.5zm8.25 0v7.5H24v-7.5zm2 2H22v3.5h-3.5zM0 16.5V24h7.5v-7.5zm8.25 0V24h7.498v-7.5zm8.25 0V24H24v-7.5z"/>
  </g>

  <!-- Tracked Uppercase Chrome Label -->
  <text x="38" y="21" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1" fill="url(#txt_pnpm)">PNPM</text>
</svg>
